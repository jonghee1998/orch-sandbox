# 원격 브랜치 정리 (수동 실행). main 과 열린 PR 의 브랜치, 진행 중인 run 의 브랜치(orch/run-N*, Issue 에 orch:run)는 남기고 나머지를 지운다.
# 지운 PR 브랜치는 해당 PR 화면의 "Restore branch" 로 되살릴 수 있다. 먼저 dry_run 으로 목록만 확인할 수 있다.
name: cleanup-branches
run-name: "cleanup-branches (dry_run=${{ inputs.dry_run }})"

on:
  workflow_dispatch:
    inputs:
      dry_run: { description: "목록만 보고 지우지 않음", type: boolean, default: true }

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # delete refs
      pull-requests: read
      issues: read
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          keep=$(mktemp)
          echo main > "$keep"
          gh api --paginate "repos/$R/pulls?state=open&per_page=100" --jq '.[].head.ref' >> "$keep"
          for n in $(gh api --paginate "repos/$R/issues?state=open&labels=orch:run&per_page=100" --jq '.[].number'); do
            gh api --paginate "repos/$R/branches?per_page=100" --jq '.[].name' | grep -E "^orch/run-${n}(-|$)" >> "$keep" || true
          done
          deleted=0; kept=0
          echo "### 브랜치 정리 (dry_run=$DRY)" >> "$GITHUB_STEP_SUMMARY"
          for b in $(gh api --paginate "repos/$R/branches?per_page=100" --jq '.[].name'); do
            if grep -qxF "$b" "$keep"; then kept=$((kept+1)); continue; fi
            if [ "$DRY" = "true" ]; then echo "- (지울 예정) $b" >> "$GITHUB_STEP_SUMMARY"; deleted=$((deleted+1)); continue; fi
            if gh api -X DELETE "repos/$R/git/refs/heads/$b" --silent; then deleted=$((deleted+1)); else echo "- 실패 $b" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "남김 $kept개 · 정리 $deleted개" >> "$GITHUB_STEP_SUMMARY"
