# One-time (or after expiry) Codex login from a phone, for the usage dashboard.
#   Actions → codex-login → Run workflow. The login URL and one-time code appear in this run's summary
#   and as a comment on the `orch:usage` Issue. Approve on the phone within 15 minutes.
# The login is encrypted with secret CODEX_AUTH_KEY (AES-256) and kept in the Actions cache; it is used
# only by usage.yml to read Codex rate limits (account/rateLimits/read). Nothing else uses it.
name: codex-login

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: orch-usage
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      - name: Check key
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: |
          if [ ${#CODEX_AUTH_KEY} -lt 20 ]; then
            echo "### 먼저 저장소 Settings → Secrets → Actions 에 CODEX_AUTH_KEY(20자 이상 아무 문자열)를 추가하세요." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Device-code login (approve on phone)
        id: login
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          umask 077
          npm i -g @openai/codex >/dev/null 2>&1
          codex login --device-auth > /tmp/login.log 2>&1 &
          LP=$!
          for i in $(seq 1 30); do sleep 2; grep -q 'https://' /tmp/login.log && break; done
          sleep 2
          URL=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/login.log | grep -oE 'https://[^ ]+' | head -1)
          CODE=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/login.log | grep -oE '\b[A-Z0-9]{4}-[A-Z0-9]{4,5}\b' | head -1)
          MSG="📱 **Codex 로그인 승인** — 15분 안에
          1. 폰에서 열기: ${URL:-로그인 주소를 찾지 못함}
          2. 코드 입력: **${CODE:-?}**"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          ISSUE=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=orch:usage&state=open&per_page=1" --jq '.[0].number // empty')
          [ -n "$ISSUE" ] && gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -f body="$MSG" --silent
          for i in $(seq 1 90); do kill -0 $LP 2>/dev/null || break; sleep 10; done
          wait $LP; rc=$?
          if [ $rc -eq 0 ] && codex login status >/dev/null 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; echo "✅ 로그인 완료" >> "$GITHUB_STEP_SUMMARY"
          else echo "❌ 로그인 실패 또는 시간 초과 — 다시 실행하세요." >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - name: Encrypt login
        if: steps.login.outputs.ok == 'true'
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: |
          umask 077; mkdir -p ~/.orch
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CODEX_AUTH_KEY -in ~/.codex/auth.json -out ~/.orch/codex-auth.enc
      - name: Remove Codex credentials from the runner
        if: always()
        run: rm -rf ~/.codex
      - name: Save encrypted login
        if: steps.login.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.orch/codex-auth.enc
          key: codex-auth-${{ github.run_id }}
      - name: Prune old entries and refresh usage now
        if: steps.login.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: codex-auth-${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=codex-auth-&per_page=100" --jq '.actions_caches[] | select(.key != env.KEEP) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || true; done
          gh workflow run usage.yml --ref main -R "$GITHUB_REPOSITORY"
