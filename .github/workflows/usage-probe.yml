# Temporary probe (do not merge): can the engine's Claude token read subscription usage?
# Prints only rate-limit related JSON events (status, utilization %, reset times). Never the token.
name: usage-probe
on:
  pull_request:
    paths: [".github/workflows/usage-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Claude Code one-shot, capture rate-limit events
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          npm i -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version
          claude -p "Reply with OK only." --model haiku --max-turns 1 --output-format stream-json --verbose > /tmp/s.jsonl 2>/tmp/err.txt
          echo "exit $? lines $(wc -l </tmp/s.jsonl)"
          echo "event types:"; jq -r '.type + (if .subtype then "/" + .subtype else "" end)' /tmp/s.jsonl | sort | uniq -c
          echo "rate-limit events:"; grep -i 'rate' /tmp/s.jsonl | jq -c 'del(.session_id, .uuid)' | head -5
          echo "result usage:"; jq -c 'select(.type=="result") | {usage, total_cost_usd, modelUsage}' /tmp/s.jsonl | head -c 800; echo
          head -c 300 /tmp/err.txt
          rm -f /tmp/s.jsonl /tmp/err.txt
